                            allow="autoplay; encrypted-media">

                    <!-- Initial Preview Poster & Custom Play Overlay -->

                        <img id="overlayImage" src="" alt="Video Preview" class="absolute inset-0 w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 backdrop-blur-[2px]"></div>
                        
                        <!-- Custom Play Button (Triggers Smartlink 1x) -->

                            <i class="fa-solid fa-play text-xl sm:text-2xl ml-1"></i>
                        </button>
                    </div>
                </div>

                <!-- Active Video Title -->
                <div class="px-1 pt-0.5">
                    <h2 id="activeTitle" class="text-xs sm:text-base font-bold text-slate-100 truncate tracking-wide">
                        Loading...

        <!-- COMPACT VIDEO GRID SECTION -->
        <section class="space-y-2 sm:space-y-3">
            <!-- Compact Section Header -->
            <div class="flex items-center justify-between px-1">
                <h3 class="text-xs sm:text-sm font-semibold text-slate-300 flex items-center gap-1.5">
                    <i class="fa-solid fa-list-ul text-pink-400 text-xs"></i> Pilihan Video
                </h3>
                <div id="videoCounter" class="text-[10px] sm:text-xs text-slate-400 bg-slate-900/80 px-2 py-0.5 rounded-md border border-slate-800">
                    Halaman 1
                </div>
            </div>

            <!-- Ultra-Compact Video Cards (2x2 on Mobile for 1-screen fit) -->
            <div id="videoGrid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3">
                <!-- Cards populated dynamically -->
            </div>

            <!-- COMPACT PAGINATION CONTROLS -->
            <div class="glass-panel rounded-xl p-2 flex items-center justify-between gap-2">
                <button id="prevBtn" onclick="changePage(currentPage - 1)" 
                        class="px-2.5 py-1.5 rounded-lg bg-slate-800/90 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-300 hover:text-white text-[11px] font-medium flex items-center gap-1 transition cursor-pointer disabled:cursor-not-allowed">
                    <i class="fa-solid fa-chevron-left text-[9px]"></i> <span class="hidden sm:inline">Prev</span>
                </button>

                <!-- Page Number Buttons -->
                <div id="paginationNumbers" class="flex items-center gap-1.5">
                    <!-- Dynamic numbers -->
                </div>

                <button id="nextBtn" onclick="changePage(currentPage + 1)" 
                        class="px-2.5 py-1.5 rounded-lg bg-slate-800/90 hover:bg-pink-600 disabled:opacity-30 disabled:hover:bg-slate-800 text-slate-300 hover:text-white text-[11px] font-medium flex items-center gap-1 transition cursor-pointer disabled:cursor-not-allowed">
                    <span class="hidden sm:inline">Next</span> <i class="fa-solid fa-chevron-right text-[9px]"></i>
                </button>
            </div>
        </section>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // 1. DATA VIDEO (16 Videos)
        const videoDatabase = [
            { id: 1, title: "Bawa spg nginap di hotel", src: "https://trbnvideo.live/e/Q8OTb3l0", poster: "https://i.ibb.co/qYbbmQ6R/Screenshot-2026-1031-075743.png" },
            { id: 2, title: "Boking cewek cantik", src: "https://trbnvideo.live/e/q1LeKbHe", poster: "https://i.ibb.co/VWHyPXbj/Screenshot-2026-1031-075955.png" },
            { id: 3, title: "Gadis sma cantik", src: "https://trbnvideo.live/e/CQcGvyVa", poster: "https://i.ibb.co/S7sFtzXm/Screenshot-2026-1031-080400.png" },
            { id: 4, title: "Abg kesakitan smpe nangis", src: "https://trbnvideo.live/e/SVXyR42j", poster: "https://i.ibb.co/Gvfr6vtV/Screenshot-2026-1031-083941.png" },
            { id: 5, title: "Ahyon jilbab", src: "https://trbnvideo.live/e/DtjKh9CG", poster: "https://i.ibb.co.com/Tqvwkkd8/Screenshot-2026-1029-002208.png" },
            { id: 6, title: "nginep di kost pacar", src: "https://trbnvideo.live/e/S4A8HsxX", poster: "https://i.ibb.co.com/cKhW90v3/Screenshot-2026-1029-003252.png" },
            { id: 7, title: "Goyangannya bikin gak tahan", src: "https://trbnvideo.live/e/W5K2ggG1", poster: "https://i.ibb.co.com/GmnYvhX/Screenshot-2026-1029-003737.png" },
            { id: 8, title: "Sepupu toubrutt", src: "https://trbnvideo.live/e/k8NrIjie", poster: "https://i.ibb.co.com/LzN5Pw3L/Screenshot-2026-1028-235223.png" },
            { id: 9, title: "Minta dibeliin iphone", src: "https://trbnvideo.live/e/E6yudbMs", poster: "https://i.ibb.co.com/S433n7H2/Screenshot-2026-1029-001612.png" },
            { id: 10, title: "jilbab toubrutt", src: "https://trbnvideo.live/e/08SNgxe9", poster: "https://i.ibb.co.com/3VGdCJ8/Screenshot-2026-1029-001858.png" },
            { id: 11, title: "Gina jilboob", src: "https://trbnvideo.live/e/F51NRzNP", poster: "https://i.ibb.co/NnKs0Hnd/images-4.jpg" },
            { id: 12, title: "Gina Hijaber toge binal", src: "https://trbnvideo.live/e/H6jg5ztO", poster: "https://i.ibb.co/gZ3QjTdD/images-1.jpg" },
            { id: 13, title: "Malu tapi menikmati", src: "https://trbnvideo.live/e/GSBw9P3Q", poster: "https://i.ibb.co/mVGSn03K/Screenshot-2026-1031-072703.png" },
            { id: 14, title: "Jilbab mendesah dapet batang gede", src: "https://trbnvideo.live/e/NTgAYglk", poster: "https://i.ibb.co/Kp6q01J2/Screenshot-2026-1031-072954.png" },
            { id: 15, title: "Jilbab coklat binal", src: "https://trbnvideo.live/e/a03aWEYS", poster: "https://i.ibb.co/tMPDkKmj/Screenshot-2026-1031-073143.png" },
            { id: 16, title: "Cantik & mulus", src: "https://trbnvideo.live/e/XXvnStXb", poster: "https://i.ibb.co/LdLFpdL8/Screenshot-2026-1031-084559.png" }
        ];

        // 2. CONFIG & STATE
        const SMARTLINK_URL = "https://auctionr.org/4/24b55e3636d607271fdc76c2cd116ebe";
        const ITEMS_PER_PAGE = 4;
        
        let currentPage = 1;
        let activeVideoId = 1;
        let filteredVideos = [...videoDatabase];
        let currentVideo = videoDatabase[0];

        // 3. DOM ELEMENTS
        const mainPlayerFrame = document.getElementById('mainPlayerFrame');
        const playerOverlay = document.getElementById('playerOverlay');
        const overlayImage = document.getElementById('overlayImage');
        const activeTitle = document.getElementById('activeTitle');
        const videoGrid = document.getElementById('videoGrid');
        const paginationNumbers = document.getElementById('paginationNumbers');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const searchInput = document.getElementById('searchInput');
        const videoCounter = document.getElementById('videoCounter');

        // 4. INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            selectVideo(videoDatabase[0]);
            renderGrid();
        });

        // 5. SMARTLINK TRIGGER LOGIC (TRIGGERS EVERY TIME PLAY BUTTON IS CLICKED)
        function handleInitialPlay() {
            // Trigger Smartlink on new tab EVERY TIME user clicks play overlay
            window.open(SMARTLINK_URL, '_blank');

            // Hide Overlay & Load iFrame with Autoplay
            playerOverlay.classList.add('hidden');
            mainPlayerFrame.src = currentVideo.src + "?autoplay=1";
        }

        // 6. SELECT VIDEO FROM LIST (RESETS PLAY OVERLAY & PREPARES SMARTLINK TRIGGER)
        function selectVideo(video) {
            activeVideoId = video.id;
            currentVideo = video;
            
            activeTitle.textContent = video.title;
            overlayImage.src = video.poster;

            // Always show overlay when selecting a video, so user must click Play button
            playerOverlay.classList.remove('hidden');
            mainPlayerFrame.src = ""; // Clear current video source until play button is pressed

            renderGrid();
        }

        // 7. RENDER VIDEO GRID (COMPACT 4 ITEMS PER PAGE)
        function renderGrid() {
            const totalPages = Math.ceil(filteredVideos.length / ITEMS_PER_PAGE) || 1;
            
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const currentVideos = filteredVideos.slice(startIndex, endIndex);

            videoCounter.textContent = `Halaman ${currentPage} / ${totalPages}`;

            videoGrid.innerHTML = '';

            if (currentVideos.length === 0) {
                videoGrid.innerHTML = `
                    <div class="col-span-full text-center py-6 text-slate-400">
                        <p class="text-xs">Tidak ada video yang ditemukan.</p>
                    </div>
                `;
                renderPagination(0);
                return;
            }

            currentVideos.forEach(video => {
                const isActive = video.id === activeVideoId;
                const card = document.createElement('div');
                card.className = `fade-in group cursor-pointer glass-panel rounded-lg overflow-hidden border transition-all duration-200 flex flex-col justify-between ${
                    isActive ? 'border-pink-500 ring-1 ring-pink-500/50' : 'border-slate-800/80 hover:border-slate-700'
                }`;

                card.onclick = () => selectVideo(video);

                card.innerHTML = `
                    <div>
                        <!-- Thumbnail Container -->
                        <div class="relative aspect-video w-full overflow-hidden bg-slate-900">
                            <img src="${video.poster}" 
                                 alt="${video.title}" 
                                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                            
                            <!-- Overlay Play Button -->
                            <div class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition">
                                <div class="w-7 h-7 rounded-full bg-pink-600/90 text-white flex items-center justify-center transform scale-90 group-hover:scale-100 transition duration-200">
                                    <i class="fa-solid fa-play text-[10px] ml-0.5"></i>
                                </div>
                            </div>

                            ${isActive ? `
                                <span class="absolute top-1 left-1 px-1.5 py-0.2 bg-pink-600 text-white text-[8px] font-bold rounded flex items-center gap-1">
                                    <span class="w-1 h-1 rounded-full bg-white animate-ping"></span> DIPUTAR
                                </span>
                            ` : ''}
                        </div>

                        <!-- Card Title -->
                        <div class="p-1.5 sm:p-2">
                            <h4 class="text-[11px] sm:text-xs font-medium text-slate-200 line-clamp-1 group-hover:text-pink-400 transition-colors">
                                ${video.title}
                            </h4>
                        </div>
                    </div>
                `;

                videoGrid.appendChild(card);
            });

            renderPagination(totalPages);
        }

        // 8. RENDER PAGINATION BUTTONS
        function renderPagination(totalPages) {
            paginationNumbers.innerHTML = '';

            prevBtn.disabled = currentPage === 1 || totalPages === 0;
            nextBtn.disabled = currentPage === totalPages || totalPages === 0;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = `w-7 h-7 rounded-lg text-[11px] font-medium transition flex items-center justify-center cursor-pointer ${
                    i === currentPage 
                    ? 'bg-pink-600 text-white font-bold shadow-md shadow-pink-600/30' 
                    : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`;
                btn.onclick = () => changePage(i);
                paginationNumbers.appendChild(btn);
            }
        }

        // 9. PAGE NAVIGATION
        function changePage(newPage) {
            const totalPages = Math.ceil(filteredVideos.length / ITEMS_PER_PAGE);
            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderGrid();
            }
        }

        // 10. REAL-TIME SEARCH FILTER
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            filteredVideos = videoDatabase.filter(video => 
                video.title.toLowerCase().includes(query)
            );
            currentPage = 1;
            renderGrid();
        });
    </script>
</body>
</html>
